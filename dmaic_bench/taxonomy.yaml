# DMAIC-Bench canonical method taxonomy (v1).
#
# The shared vocabulary between ground truth and every contestant's trace. Each entry:
#   method_id          system-agnostic identifier (family.name)
#   spec_keys          solver-spec keys of the private contestant's engine that map onto this
#                      method (used only by that operator-side adapter, never by scoring)
#   aliases            names/synonyms used to recognize self-reported methods and report mentions
#   family             metric grouping
#   applicability      data_type + prerequisites, used by the MS-Misuse judge
#   canonical_outputs  standard output field names (suffix-matched) with tolerance classes
#     tol_class: exact = closed-form arithmetic (rel 1e-6) | tight = domain tolerance | soft = convention-variant
#
# prerequisites vocabulary: stability_confirmed, normality_holds, msa_passed, variances_equal
# data_type vocabulary: continuous | attribute_proportion | attribute_count_rate | categorical | any

schema_version: 1
methods:
  # ---- meta -----------------------------------------------------------------
  - method_id: meta.data_profiling
    spec_keys: [solver.meta.data-classifier.v1]
    aliases: [data classification, data profiling]
    family: meta
    applicability: {data_type: any, prerequisites: []}
    canonical_outputs: []

  # ---- MSA ------------------------------------------------------------------
  - method_id: msa.gage_rr_crossed
    spec_keys: [solver.gage.rr-crossed.v1]
    aliases: [gage r&r, crossed grr, grr]
    family: msa
    applicability: {data_type: continuous, prerequisites: []}
    canonical_outputs:
      - {name: percentStudyVariation, tol_class: soft}
      - {name: percentTolerance, tol_class: soft}
      - {name: ndc, tol_class: tight}
  - method_id: msa.attribute_agreement
