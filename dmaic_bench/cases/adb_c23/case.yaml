context: |
  We are the quality team at a plant that machines steering knuckles for the automotive trade.
  The customer's annual audit has put it to us that before we discuss any change to a process
  step, we must first show that our own records can be relied on. The critical shaft diameter
  is taken by three operators on one and the same digital micrometer; the appearance and the
  burr condition of the finished part are judged pass or fail by eye by three inspectors. We
  organised two dedicated studies. In the first, the three operators each measured the shaft
  diameter of the same batch of ten steering knuckles three times over. In the second, the
  three inspectors each judged thirty sample parts twice over, independently, and their calls
  were set against the condition a senior engineer had established for each part beforehand.

goal: |
  From the two studies, quantify separately how much of the spread in the dimensional readings
  belongs to the act of measuring, and how closely the judgements made by eye agree with the
  established condition. Say whether this measuring and judging system reaches a level that can
  be relied on, and give a clear conclusion on whether the records we already hold may go on
  being used to carry the project forward.

stages:
  - stage_id: M_GRR
    phase: measure
    label: "Repeat shaft-diameter readings taken by three operators on the same ten parts"
    topics: ["shaft diameter", "micrometer", "repeat readings", "three operators"]
    methods:
      - method_id: msa.gage_rr_crossed
        required: true
  - stage_id: M_AttrAgreement
    phase: measure
    label: "Repeat pass-or-fail calls made by eye by three inspectors, set against the established condition"
    topics: ["visual", "by eye", "three inspectors", "established condition", "repeat judgements"]
    methods:
      - method_id: msa.attribute_agreement
        required: true

decision_points:
