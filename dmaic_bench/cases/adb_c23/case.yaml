    phase: measure
    rule: "Both measurement-system studies must pass (dimensional measurement variation as a share of study variation is within the acceptable limit, and visual judgments agree closely with the reference) before subsequent process data are trusted and the project proceeds."
    source: "AIAG MSA-4"
    correct_branch: proceed
    acceptable_branches: []
    branch_evidence:
      proceed: [msa.attribute_agreement]

faults:
