industry: discrete_manufacturing
provenance: SIMULATED
y_type: continuous
language: en
parametric: true

# --- difficulty axis: OBSERVED human effort ---------------------------------
# expert_hours = total practitioner-hours the recorded project team spent; junior_hours =
# hours for a competent engineer new to the method set. Both are read off the source project
